name: Preprocessing

on:
  push:
    branches: [main]
    paths:
      - "ai4i2020_raw/**"
      - "preprocessing/automate_Aunuun-Jeffry-Mahbuubi.py"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:

# izin menulis dibutuhkan agar hasil preprocessing dapat di-commit oleh workflow;
# push dengan GITHUB_TOKEN tidak memicu workflow baru, dan folder hasil tidak ada di daftar paths
permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v7

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pasang dependensi
        run: python -m pip install -r requirements.txt

      - name: Jalankan preprocessing
        run: >
          python preprocessing/automate_Aunuun-Jeffry-Mahbuubi.py
          --raw ai4i2020_raw/ai4i2020.csv
          --out preprocessing/ai4i2020_preprocessing

      - name: Commit hasil preprocessing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/ai4i2020_preprocessing
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada hasil preprocessing."
          else
            git commit -m "Perbarui hasil preprocessing"
            git push
          fi

      - name: Unggah hasil sebagai artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai4i2020_preprocessing
          path: preprocessing/ai4i2020_preprocessing
